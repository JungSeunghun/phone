name: Public release readiness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check publication documents
        run: |
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f README.ko.md
      - name: Test public audit policies
        run: node --test desktop/scripts/release-tests/public-release-audit.test.mjs
      - name: Scan files and full Git history without printing contents
        run: node desktop/scripts/public-release-audit.mjs
