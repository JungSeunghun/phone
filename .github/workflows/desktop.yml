name: Phone Mirror Desktop
on:
  push:
    paths:
      [
        "desktop/**",
        "Vendor/**",
        ".github/workflows/desktop.yml",
        ".github/workflows/desktop-release.yml",
      ]
  pull_request:
    paths:
      [
        "desktop/**",
        "Vendor/**",
        ".github/workflows/desktop.yml",
        ".github/workflows/desktop-release.yml",
      ]
  workflow_dispatch:
jobs:
  verify-and-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm run test:release
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run format:check
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: phone-mirror-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/src-tauri/target/release/phone-mirror-desktop.exe
