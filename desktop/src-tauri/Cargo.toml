[package]
name = "phone-mirror-desktop"
version = "0.2.2"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/JungSeunghun/phone-mirror"

[lib]
name = "phone_mirror_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "phone-mirror-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:arboard", "dep:tauri-plugin-updater"]

[dependencies]
arboard = { version = "3.6", optional = true, default-features = false }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", optional = true , features = [] }

tauri-plugin-dialog = { version = "2", optional = true }
mp4 = "0.14"
oxideav-aac = "=0.1.7"
plist = "=1.7.0"
# Keep the previously validated plist timestamp implementation pinned.
time = "=0.3.44"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
if-addrs = "0.15"
tauri-plugin-updater = { version = "2.13.3", optional = true }
semver = "1.0.28"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
minisign-verify = "0.3.0"
base64 = "0.23.1"

[profile.dev.package.oxideav-aac]
opt-level = 3

[profile.dev.package.oxideav-core]
opt-level = 3
