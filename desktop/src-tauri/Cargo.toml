[package]
name = "phone-mirror-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "phone_mirror_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "phone-mirror-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", optional = true , features = [] }

tauri-plugin-dialog = { version = "2", optional = true }
mp4 = "0.14"
oxideav-aac = "=0.1.7"
plist = "=1.7.0"
# Keep plist timestamps compatible with the declared Rust 1.85 minimum.
time = "=0.3.44"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
if-addrs = "0.15"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.oxideav-aac]
opt-level = 3

[profile.dev.package.oxideav-core]
opt-level = 3
